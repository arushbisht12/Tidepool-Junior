# main() is the supervisor; worker priorities will be 4 and 5.
CONFIG_MAIN_THREAD_PRIORITY=6
CONFIG_MAIN_STACK_SIZE=2048

# This exercise targets QEMU; keep simulated sleeps close to wall-clock time.
CONFIG_QEMU_ICOUNT=n

CONFIG_ASSERT=y

# Allow printing floats
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_CPP=y


